<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7ec8ff">
  <title>Sky Jump</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>

    <div id="hud">Score: <span id="score">0</span></div>

    <!-- Layar awal -->
    <div id="start-screen" class="overlay">
      <h1>Sky Jump</h1>
      <p class="hint">Tap &amp; tahan sisi <b>kiri</b> / <b>kanan</b> layar<br>untuk bergerak</p>
      <p class="tap">Tap untuk Mulai</p>
    </div>

    <!-- Layar game over -->
    <div id="over-screen" class="overlay hidden">
      <img id="lose-img" src="assets/cewe-kalah.png" alt="" onerror="this.style.display='none'">
      <h1>Yahh Jatuh!</h1>
      <p class="final">Final Score: <span id="final-score">0</span></p>
      <p class="best">Terbaik: <span id="best-score">0</span></p>
      <p class="tap">Tap untuk Main Lagi</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
